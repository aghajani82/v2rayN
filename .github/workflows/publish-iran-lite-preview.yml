name: Publish Iran Lite preview

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/publish-iran-lite-preview.yml'

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-iran-lite-preview
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'aghajani82/v2rayN' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_SHA: '9953885fb73ecd6306d9b316931c7c98e42caa0c'
      RUN_ID: '45859350533'
      RELEASE_TAG: 'iran-lite-windows-preview.2'
      ARTIFACT: 'v2rayN-Aghajani-Iran-Lite-win-x64'
      ASSET: 'v2rayN-Aghajani-Iran-Lite-win-x64.zip'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Publish the verified preview artifact
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Preview release already exists."
            exit 0
          fi
          git merge-base --is-ancestor "$SOURCE_SHA" HEAD
          test "$(gh run view "$RUN_ID" --json conclusion --jq .conclusion)" = success
          gh run download "$RUN_ID" --name "$ARTIFACT" --dir package
          cd package
          sha256sum --strict --check "$ASSET.sha256"
          gh release create "$RELEASE_TAG" "$ASSET" "$ASSET.sha256" \
            --target "$SOURCE_SHA" --title 'Iran Lite Windows Preview 2' \
            --prerelease --latest=false \
            --notes 'Portable Windows x64 preview. Extract it in a fresh folder and launch v2rayN.exe. Iran Lite keeps ChatGPT on the proxy before direct routes. Built by Actions run 45859350533.'
